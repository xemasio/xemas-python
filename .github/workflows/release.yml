# Publish xemas-sdk to PyPI via Trusted Publishing (OIDC).
#
# There is no PyPI token anywhere in this repository, and there must never be one. PyPI matches the
# GitHub OIDC claim against owner/repository/workflow/environment, so the identity below is the
# credential:
#
#     owner       xemasio
#     repository  xemas-python
#     workflow    release.yml      <- this file's NAME is part of the identity; renaming it breaks
#                                     publishing until the PyPI publisher record is updated too
#     environment release          <- gated, so a publish waits for human approval
#
# Triggered by publishing a GitHub Release, not by every push: a release should be a deliberate act
# with a tag behind it, and the tag is what people install.
name: release

on:
  release:
    types: [published]
  # Lets the whole pipeline be exercised without publishing anything - useful for verifying the
  # workflow itself before a real release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares (requires-python >=3.9); the ceiling is current. If
        # this matrix and that floor ever disagree, the package is claiming support it does not test.
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q

  build:
    name: build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches the packaged version
        # Guards the failure that is painful to undo: a release tagged v0.1.1 that ships 0.1.0.
        # PyPI versions are immutable, so catching this before upload is the only cheap moment.
        if: github.event_name == 'release'
        run: |
          python -m pip install --upgrade pip
          pip install tomli
          PKG=$(python -c "import tomli;print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "packaged version: $PKG"
          echo "release tag     : $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $PKG. PyPI versions are immutable - fix the version or the tag before releasing."
            exit 1
          fi

      - run: python -m pip install --upgrade pip build
      - run: python -m build          # produces both the wheel and the sdist
      - name: Show what will be published
        run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # Required approval gate. Nothing reaches PyPI until a human approves this job.
    environment:
      name: release
      url: https://pypi.org/project/xemas-sdk/
    permissions:
      id-token: write            # the OIDC token IS the credential - no secrets needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `user`/`password`/`api-token`: supplying one would defeat the point of trusted
        # publishing and reintroduce a long-lived credential.
