[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xemas-sdk"
version = "0.1.0"
description = "Official Python SDK for the XemaS on-chain intelligence API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "XemaS" }]
keywords = ["blockchain", "security", "on-chain", "intelligence", "web3", "xemas"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24", "pydantic>=2.0"]

[project.urls]
Homepage = "https://xemas.io"
Documentation = "https://xemas.io/api"
Source = "https://github.com/xemasio/xemas-python"
Issues = "https://github.com/xemasio/xemas-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/xemas"]
